name: "GateSentry DevSecOps CI"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GateSentry.slnx

      - name: Build
        run: dotnet build GateSentry.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GateSentry.slnx --no-build -c Release --verbosity normal

  security-scan:
    name: Self-Scan & SARIF Upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run GateSentry Scan
        run: |
          dotnet run --project src/GateSentry.Cli -- scan . --sarif gatesentry-results.sarif --fail-on High

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gatesentry-results.sarif
